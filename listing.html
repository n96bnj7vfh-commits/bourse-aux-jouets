<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listing – Bourse aux jouets</title>
<link rel="stylesheet" href="commun.css">
<script src="lib/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="commun.js"></script>
<style>
  /* Saisie : tout doit tenir sur un écran d'iPhone, barre de Safari comprise (pas de défilement) */
  .entete { padding: 8px 14px; }
  .page { padding-bottom: 130px; gap: 8px; padding-top: 8px; }
  #zoneGrille.card { padding: 10px 12px; }
  .titreg { display: flex; justify-content: space-between; align-items: baseline; }
  .titreg h2 { font-size: 20px; }
  .barre { display: flex; gap: 4px; margin-top: 6px; }
  .barre button { flex: 1 1 0; padding: 3px 0; border: 1px solid var(--line); background: var(--soft); border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 40px; line-height: 1.1; }
  .barre button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .barre button small { display: block; font-weight: 500; font-size: 10px; opacity: .8; white-space: nowrap; }
  .affiche { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 14px; border-radius: 12px; background: var(--soft); margin-top: 6px; }
  .affiche .nombre { font-size: 44px; line-height: 1.1; }
  .msgg { font-size: 14px; font-weight: 600; margin: 4px 0 0; min-height: 0; }
  .msgg.ok { color: var(--ok); } .msgg.warn { color: var(--warn); } .msgg.err { color: var(--err); }
  #descIn { width: 100%; margin-top: 6px; min-height: 40px; padding: 7px 12px; }
  .rapides { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .rapides button { white-space: nowrap; padding: 0 2px; font-weight: 700; font-size: 15px; min-height: 42px; border-radius: 10px; border: 2px solid var(--acc); background: transparent; color: var(--acc); cursor: pointer; }
  .pave { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .pave button { font-weight: 600; font-size: 24px; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); cursor: pointer; }
  /* Boutons d'action fixés en bas, au-dessus de la barre de Safari */
  .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); box-shadow: 0 -6px 16px rgba(24,33,58,.12); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .actions > div { max-width: 1000px; margin: 0 auto; }
  .actions .btn.big { font-size: 20px; padding: 11px; }
  .trois { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .trois .btn { min-height: 40px; padding: 6px 4px; font-size: 15px; }
  .recap li button { flex: 1; text-align: left; background: none; border: 0; padding: 4px 0; cursor: pointer; font-size: 16px; }
  .totalg { display: flex; justify-content: space-between; align-items: center; background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  .totalg .nombre { font-size: 30px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="entete">
  <h1>Listing (dépôt)</h1>
  <span class="pastille" id="sync" hidden></span>
  <span id="mode"></span>
  <button class="lien" id="quitter">Quitter</button>
</header>

<main class="page">
  <!-- 1. Scanner la grille -->
  <div id="rejets"></div>
  <section class="card" id="zoneScan">
    <h2>Scanner la grille</h2>
    <p class="note">Le QR en tête de grille (à côté du code en gros).</p>
    <div id="video" class="video" style="margin-top:8px"></div>
    <div id="reglages"></div>
    <p class="msg mute" id="msgScan" role="status"></p>
    <div class="saisie">
      <input id="grilleIn" placeholder="ou tapez le code : A1" autocomplete="off" autocapitalize="characters">
      <button class="btn" id="grilleBtn">Ouvrir</button>
    </div>
  </section>

  <!-- 2. Saisie / récapitulatif -->
  <section class="card" id="zoneGrille" hidden></section>
</main>

<div class="plein" id="ferme" hidden>
  <div class="card"><h2>Listing fermé</h2>
    <p id="fermeTxt"></p>
    <button class="btn" id="fermeBtn" style="width:100%;margin-top:10px">Vérifier à nouveau</button>
  </div>
</div>

<script>
(async () => {
const { $, esc, eur, eur2, son, deux } = BJ;
let edition = '', mode = '';
let L = null; // grille ouverte : { g, court, idx, buf, pre, prix[8], desc[8], statuts[8], recap, edit }

const scanner = BJ.creerScanner('video', 'reglages', texte => ouvrir(texte));
const msgScan = (type, t) => { $('msgScan').className = 'msg ' + type; $('msgScan').textContent = t; };

// ---------- Ouverture d'une grille ----------
async function ouvrir(brut) {
  if (L) return;
  const p = BJ.lireCode(brut);
  if (p.ed && p.ed !== edition) { son('erreur'); return msgScan('err', `Grille d'une autre édition (20${p.ed}) : donner une grille de réserve.`); }
  if (!p.kind) { son('erreur'); return msgScan('err', `« ${brut} » n'est pas un code de grille.`); }
  const court = p.kind === 'art' ? p.code.split('-')[0] : p.code; // un talon scanné ouvre sa grille
  if (!cat) { // catalogue pas encore chargé (tout début) : on le charge une fois
    msgScan('mute', 'Chargement des grilles…');
    if (!(await chargerCatalogue())) { son('erreur'); return msgScan('err', 'Pas de réseau : impossible de charger les grilles. Réessayez.'); }
  }
  // Ouverture instantanée : tout est déjà dans le téléphone (catalogue), sans attendre le serveur
  const g = edition + '-' + court;
  const statut = cat.grilles[g];
  if (statut == null) { son('erreur'); return msgScan('err', `Grille inconnue : ${court} (elle n'a pas été générée).`); }
  if (statut === 'restituee') { son('erreur'); return msgScan('err', court + ' est déjà restituée.'); }
  son('ok');
  scanner.arreter();
  const arts = [1, 2, 3, 4, 5, 6, 7, 8].map(n => cat.articles[g + '-' + deux(n)] || ['', '', 'vierge']);
  L = { g, court, idx: 0, buf: '', pre: false, recap: statut !== 'vierge', edit: false,
    prix: arts.map(a => a[0] === '' || a[0] == null ? null : Number(a[0])), desc: arts.map(a => String(a[1] || '')), statuts: arts.map(a => a[2]) };
  L.message = statut === 'vierge' ? ['ok', `Grille ${court} ouverte.`] : ['warn', `${court} déjà déposée : vous pouvez la modifier.`];
  if (!L.recap) allerA(0);
  afficher();
}

// ---------- Catalogue (toutes les grilles, gardé sur le téléphone) et file d'envoi ----------
const lire = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const ecrire = (k, v) => localStorage.setItem(k, JSON.stringify(v));
let cat = null;                         // { grilles: { '27-A1': statut }, articles: { '27-A1-03': [prix, desc, statut] } }
let file = lire('fileListing', []);     // grilles validées pas encore confirmées par le serveur
let horsLigne = false;

// Applique une grille validée au catalogue local (pour la rouvrir telle quelle avant même la réponse du serveur)
function appliquer(envoi) {
  if (!cat) return;
  const g = edition + '-' + envoi.grille;
  envoi.articles.forEach(a => {
    const c = g + '-' + deux(a.n);
    const ancien = cat.articles[c] || ['', '', 'vierge'];
    cat.articles[c] = [a.prix, a.description, a.prix === '' ? 'vierge' : (ancien[2] === 'vendu' ? 'vendu' : 'depose')];
  });
  const deposes = [1, 2, 3, 4, 5, 6, 7, 8].some(n => (cat.articles[g + '-' + deux(n)] || [])[2] === 'depose');
  if (cat.grilles[g] !== 'restituee') cat.grilles[g] = deposes ? 'listee' : 'vierge';
}

async function chargerCatalogue() {
  let r;
  try { r = await BJ.api('catalogue'); } catch (e) { horsLigne = true; afficherSync(); return false; }
  if (!r.ok) return false;
  horsLigne = false;
  const articles = {};
  r.articles.forEach(a => { articles[a[0]] = [a[1], a[2], a[3]]; });
  cat = { grilles: r.grilles, articles };
  edition = r.edition;
  file.forEach(appliquer); // les envois encore en attente restent prioritaires
  changerMode(r.mode);
  return true;
}

function afficherSync() {
  const s = $('sync');
  s.hidden = false;
  if (file.length) { s.className = 'pastille attente'; s.textContent = '⏳ ' + file.length + ' en attente'; }
  else { s.className = 'pastille'; s.textContent = horsLigne ? '✓ Envoyé (hors ligne)' : '✓ Tout envoyé'; }
}

let envoiEnCours = false;
async function envoyer() {
  if (envoiEnCours || !file.length) return afficherSync();
  envoiEnCours = true;
  try {
    while (file.length) {
      const e = file[0];
      let r;
      try { r = await BJ.api('listing', { grille: e.grille, articles: e.articles }); } catch (err) { horsLigne = true; break; }
      horsLigne = false;
      if (!r.ok) {
        if (/occupé|PIN|Session/i.test(r.erreur || '')) break;       // passager : on réessaiera
        if (/mode actuel/.test(r.erreur || '')) {                    // listing fermé : toutes les grilles en attente sont perdues pour le serveur
          file.forEach(x => rejeter(x, 'le listing a été fermé avant l\'envoi'));
          file = []; ecrire('fileListing', file);
          verifierMode();
          break;
        }
        rejeter(e, r.erreur);                                        // refus définitif : ne bloque pas les suivantes
      }
      file.shift(); ecrire('fileListing', file);
    }
  } finally {
    envoiEnCours = false;
    afficherSync();
  }
}
setInterval(envoyer, 8000);
window.addEventListener('online', envoyer);

// Grilles refusées par le serveur : affichées avec leurs prix, à transmettre à l'admin (correction de prix)
function rejeter(envoi, raison) {
  const r = lire('rejetsListing', []);
  r.push({ grille: envoi.grille, raison, articles: envoi.articles.filter(a => a.prix !== '') });
  ecrire('rejetsListing', r);
  son('erreur');
  afficherRejets();
}
function afficherRejets() {
  const r = lire('rejetsListing', []);
  $('rejets').innerHTML = r.length ? `<div class="card" style="border:2px solid var(--err)">
    <h3 style="color:var(--err)">⚠ Grille(s) NON enregistrée(s)</h3>
    <p class="note">À transmettre à l'admin, qui saisira les prix (Admin > Corriger le prix) :</p>
    ${r.map(x => `<p style="margin:6px 0"><b>${esc(x.grille)}</b> (${esc(x.raison)}) : ${x.articles.map(a => esc(x.grille + '-' + deux(a.n)) + ' ' + eur(Number(a.prix))).join(' · ') || 'aucun prix'}</p>`).join('')}
    <button class="btn" id="rejetsOk" style="width:100%;margin-top:6px">C'est transmis : effacer cette liste</button></div>` : '';
  if (r.length) $('rejetsOk').onclick = () => { ecrire('rejetsListing', []); afficherRejets(); };
}
$('grilleBtn').onclick = () => { const v = $('grilleIn').value.trim(); if (v) ouvrir(v); $('grilleIn').value = ''; };
$('grilleIn').onkeydown = e => { if (e.key === 'Enter') $('grilleBtn').onclick(); };

// ---------- Pavé numérique ----------
const fmt = v => v == null ? '' : (Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.', ','));
function allerA(i) { L.idx = i; L.buf = fmt(L.prix[i]); L.pre = L.buf !== ''; }
function suivant() { if (L.idx >= 7) { L.recap = true; L.buf = ''; } else allerA(L.idx + 1); }
function apres() { if (L.edit) { L.edit = false; L.recap = true; L.buf = ''; } else suivant(); }
function lirePrix(buf) {
  const n = parseFloat(String(buf || '').replace(',', '.'));
  if (!(n > 0)) return { err: 'Tapez un prix, ou « Passer » si l\'article est absent.' };
  if (Math.round(n * 2) !== n * 2) return { err: 'Prix acceptés : euros ronds ou 0,50 (ex. 0,50 · 1 · 2,50).' };
  return { v: n };
}
const vendu = i => L.statuts[i] !== 'vierge' && L.statuts[i] !== 'depose';

function action(a, v) {
  if (!L) return;
  if (L.message && a !== 'desc') L.message = null;
  switch (a) {
    case 'rapide': L.buf = fmt(+v); L.pre = true; break;
    case 'touche':
      if (L.pre) { L.pre = false; if (v !== '⌫') L.buf = ''; }
      if (v === '⌫') L.buf = L.buf.slice(0, -1);
      else if (v === ',') { if (!L.buf.includes(',')) L.buf = (L.buf || '0') + ','; }
      else if (L.buf.replace(',', '').length < 5 && !(L.buf.includes(',') && L.buf.split(',')[1].length >= 2)) L.buf += v;
      break;
    case 'valider': {
      const p = lirePrix(L.buf);
      if (p.err) { son('erreur'); L.message = ['err', p.err]; break; }
      L.prix[L.idx] = p.v; apres(); break;
    }
    case 'passer': L.prix[L.idx] = null; apres(); break;
    case 'precedent': if (L.idx > 0) allerA(L.idx - 1); L.edit = false; break;
    case 'aller': allerA(+v); L.edit = false; break;
    case 'fin': { const p = lirePrix(L.buf); if (L.buf && !p.err) L.prix[L.idx] = p.v; L.buf = ''; L.edit = false; L.recap = true; break; }
    case 'corriger': if (vendu(+v)) { L.message = ['err', 'Article déjà vendu : non modifiable.']; break; } L.recap = false; allerA(+v); L.edit = true; break;
    case 'abandonner': L = null; msgScan('mute', 'Saisie abandonnée, rien n\'a été enregistré.'); scanner.demarrer().catch(() => {}); break;
    case 'enregistrer': enregistrer(); return;
  }
  afficher();
}

function enregistrer() {
  const n = L.prix.filter(v => v != null).length;
  if (!n) { L.message = ['err', 'Aucun prix saisi : saisissez au moins un prix, ou « Abandonner ».']; son('erreur'); return afficher(); }
  const articles = L.prix.map((p, i) => ({ n: i + 1, prix: p == null ? '' : p, description: L.desc[i] }))
    .filter((a, i) => !vendu(i));
  // Pas d'attente : la grille part dans la file d'envoi (gardée sur le téléphone), le bénévole enchaîne
  const envoi = { grille: L.court, articles, t: Date.now() };
  file = file.filter(x => x.grille !== envoi.grille); // une grille revalidée remplace l'envoi précédent
  file.push(envoi); ecrire('fileListing', file);
  appliquer(envoi);
  const total = L.prix.reduce((s, v) => s + (v || 0), 0);
  son('ok');
  msgScan('ok', `${L.court} validée : ${n} article(s), ${eur2(total)}. Grille suivante !`);
  L = null;
  afficher(); afficherSync();
  scanner.demarrer().catch(e => msgScan('err', 'Caméra : ' + BJ.expliquerErreurCamera(e)));
  envoyer();
}

// ---------- Affichage ----------
function afficher() {
  $('zoneScan').hidden = !!L;
  $('zoneGrille').hidden = !L;
  if (!L) return;
  const m = L.message ? `<p class="msgg ${L.message[0]}" role="status">${esc(L.message[1])}</p>` : '';
  if (L.recap) {
    const total = L.prix.reduce((s, v) => s + (v || 0), 0);
    $('zoneGrille').innerHTML = `<div class="titreg"><h2>Grille ${esc(L.court)} · récapitulatif</h2></div>${m}
      <p class="note">Touchez une ligne pour la corriger.</p>
      <ul class="lignes recap">${L.prix.map((v, i) => `<li><button data-a="corriger" data-v="${i}">${esc(L.court)}-${deux(i + 1)}${L.desc[i] ? ' · ' + esc(L.desc[i]) : ''}</button>
        <span class="nombre">${vendu(i) ? '<span class="tag t-ok">vendu</span> ' : ''}${v == null ? '<span class="tag t-n">non déposé</span>' : eur(v)}</span></li>`).join('')}</ul>
      <div class="totalg"><span>${L.prix.filter(v => v != null).length} article(s)</span><span class="nombre">${eur2(total)}</span></div>
      <div class="actions"><div>
        <button class="btn p big" data-a="enregistrer">Valider la grille</button>
        <button class="btn" data-a="abandonner" style="width:100%;margin-top:6px;min-height:40px">Abandonner</button>
      </div></div>`;
    return;
  }
  $('zoneGrille').innerHTML = `<div class="titreg"><h2>${esc(L.court)} · Article ${L.idx + 1} / 8</h2><span class="note">${esc(L.court)}-${deux(L.idx + 1)}</span></div>
    <div class="barre">${L.prix.map((v, i) => `<button class="${i === L.idx ? 'on' : ''}" data-a="aller" data-v="${i}">${i + 1}<small>${v == null ? '—' : eur(v)}</small></button>`).join('')}</div>
    <div class="affiche"><span class="note">Prix</span><span class="nombre">${L.buf ? esc(L.buf) + ' €' : '<span style="opacity:.3">0 €</span>'}</span></div>
    ${m}
    <input id="descIn" value="${esc(L.desc[L.idx])}" placeholder="Description (facultatif) : puzzle Cars…" autocomplete="off" maxlength="200">
    <div class="rapides">${[0.5, 1, 2, 3, 5].map(v => `<button data-a="rapide" data-v="${v}">${eur(v)}</button>`).join('')}</div>
    <div class="pave">${['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', '⌫'].map(k => `<button data-a="touche" data-v="${k}" aria-label="${k === '⌫' ? 'effacer' : k}">${k}</button>`).join('')}</div>
    <div class="actions"><div>
      <button class="btn p big" data-a="valider">Valider ce prix</button>
      <div class="trois"><button class="btn" data-a="precedent" ${L.idx === 0 ? 'disabled' : ''}>← Précédent</button><button class="btn" data-a="passer">Passer</button><button class="btn d" data-a="fin">Fin de grille</button></div>
    </div></div>`;
  $('descIn').oninput = e => { L.desc[L.idx] = e.target.value; };
}
$('zoneGrille').onclick = e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled) action(b.dataset.a, b.dataset.v); };

// ---------- Mode : vérifié toutes les 15 s, l'écran se bloque dès que l'admin quitte le Listing ----------
function changerMode(m) {
  if (m && m !== '?') mode = m;
  $('mode').innerHTML = BJ.badgeMode(mode);
  const ouvert = mode === 'listing' && m !== '?';
  if (ouvert) {
    if (!$('ferme').hidden) { $('ferme').hidden = true; if (!L && !scanner.actif && !document.hidden) scanner.demarrer().catch(() => {}); }
    return;
  }
  if (!$('ferme').hidden) return;
  const enCours = L ? `La grille ${L.court} en cours n'a PAS été enregistrée : notez ses prix pour l'admin.` : '';
  $('fermeTxt').innerHTML = `L'admin est passé en mode « <b>${esc((BJ.MODES[mode] || [mode])[0])}</b> » : la saisie des prix est terminée.` +
    (enCours ? `<br><br><b style="color:var(--err)">${esc(enCours)}</b>` : '') +
    (file.length ? `<br><br>${file.length} grille(s) validée(s) n'ont pas pu partir : elles s'affichent en rouge, à transmettre à l'admin.` : '');
  $('ferme').hidden = false;
  son('erreur');
  scanner.arreter();
  if (file.length) envoyer();
}
async function verifierMode() {
  let r;
  try { r = await BJ.api('connexion'); } catch (e) { return; }
  if (!r.ok) return;
  edition = r.edition;
  changerMode(r.mode);
}
setInterval(() => { if (!document.hidden) verifierMode(); }, 15000);
setInterval(() => { if (!document.hidden && !L && mode === 'listing') chargerCatalogue(); }, 60000);
$('fermeBtn').onclick = async () => { await verifierMode(); if (mode === 'listing') { await chargerCatalogue(); } };
$('quitter').onclick = () => {
  if (file.length && !confirm(file.length + ' grille(s) pas encore envoyée(s) : elles partiront à la prochaine connexion. Quitter quand même ?')) return;
  BJ.deconnexion('jetonListing');
};
document.addEventListener('visibilitychange', () => { if (document.hidden) scanner.arreter(); else { verifierMode(); envoyer(); } });
window.addEventListener('beforeunload', e => { if (file.length) { e.preventDefault(); e.returnValue = ''; } });

// ---------- Démarrage ----------
const r = await BJ.connexion({ titre: 'Listing (dépôt)', roles: ['listing'], cle: 'jetonListing' });
edition = r.edition; mode = r.mode;
afficherRejets(); afficherSync();
msgScan('mute', 'Présentez le QR de la grille.');
await chargerCatalogue();
changerMode(mode);
if (mode === 'listing' && !scanner.actif && !document.hidden) scanner.demarrer().catch(e => msgScan('err', 'Caméra : ' + BJ.expliquerErreurCamera(e) + ' (vous pouvez taper le code).'));
envoyer();
})();
</script>
</body>
</html>
