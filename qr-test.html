<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR de test – Bourse aux jouets</title>
<script src="lib/qrcode.js"></script>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 16px; color: #222; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 4px 0 12px; font-size: 14px; color: #555; }
  label { font-size: 14px; margin-right: 14px; }
  .grid { display: flex; flex-wrap: wrap; gap: 48px 56px; margin-top: 20px; }
  .card { text-align: center; padding: 8px; border: 1px dashed #bbb; background: #fff; }
  .card span { display: block; font: 600 13px monospace; margin-top: 4px; }
  .card.bad span { color: #b71c1c; }
  .card img { display: block; image-rendering: pixelated; }
  @media print { .noprint { display: none; } .card img { width: 9.5mm !important; height: 9.5mm !important; } }
</style>
</head>
<body>
<h1>QR de test (données fictives)</h1>
<p class="noprint">À afficher sur l'écran du PC (ou à imprimer) pour tester <a href="test-camera.html">la page de scan</a> avec le téléphone.
À l'impression, les QR font 9,5 mm comme sur les talons.</p>
<div class="noprint">
  <label>Taille à l'écran :
    <select id="size">
      <option value="40">petite (≈ 1 cm)</option>
      <option value="80" selected>moyenne</option>
      <option value="160">grande</option>
    </select>
  </label>
</div>
<div class="grid" id="grid"></div>

<script>
// Codes fictifs : une grille complète, une 2e grille, puis des cas d'erreur
const codes = [
  '27-A1', '27-A1-01','27-A1-02','27-A1-03','27-A1-04','27-A1-05','27-A1-06','27-A1-07','27-A1-08',
  '27-B12', '27-B12-01', '27-B12-02', '27-Z9-08',
];
const bad = ['26-A1-03', '27-I1-01', '27-A1-09', 'https://exemple.fr'];
// Note : 26-A1-03 a un format valide ; le refus « autre édition » sera fait par le serveur dans la vraie version.

function render() {
  const size = +document.getElementById('size').value;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const [list, cls] of [[codes, ''], [bad, 'bad']]) {
    for (const c of list) {
      const qr = qrcode(0, 'M'); qr.addData(c); qr.make();
      const n = qr.getModuleCount();
      const cell = Math.max(1, Math.floor(size / n));
      const div = document.createElement('div');
      div.className = 'card ' + cls;
      div.innerHTML = qr.createImgTag(cell, cell * 4) + '<span></span>';
      div.querySelector('span').textContent = c;
      grid.appendChild(div);
    }
  }
}
document.getElementById('size').onchange = render;
render();
</script>
</body>
</html>
